# Based on https://github.com/r-lib/actions/tree/v2/examples (check-standard)
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the network and optional-package tests too (they skip on CRAN)
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          # rnaturalearthhires (Suggests) is not on CRAN; see
          # Additional_repositories in DESCRIPTION
          extra-repositories: https://ropensci.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # rgnparser::install_gnparser() is defunct since rgnparser 0.3.0, so
      # fetch the release binary and put it on PATH, where rgnparser finds it
      - name: Install gnparser (needed by bdc_clean_names() tests)
        shell: bash
        env:
          GNPARSER_VERSION: v1.15.1
        run: |
          base="https://github.com/gnames/gnparser/releases/download/${GNPARSER_VERSION}"
          dest="${RUNNER_TEMP}/gnparser"
          mkdir -p "$dest"
          if [ "$RUNNER_OS" = "Windows" ]; then
            zip="${RUNNER_TEMP}/gnparser.zip"
            curl -fsSL -o "$zip" "${base}/gnparser-${GNPARSER_VERSION}-win-x86.zip"
            unzip -o "$zip" -d "$dest"
            "$dest/gnparser.exe" --version
            cygpath -w "$dest" >> "$GITHUB_PATH"
          else
            curl -fsSL "${base}/gnparser-${GNPARSER_VERSION}-linux-x86.tar.gz" | tar -xz -C "$dest"
            "$dest/gnparser" --version
            echo "$dest" >> "$GITHUB_PATH"
          fi

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true
